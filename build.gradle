plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.11'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version '1.2.11'
    id "io.kestra.gradle.plugin-doc-lint" version '1.2.11'
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id 'net.researchgate.release' version '3.2.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_21

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Alibaba Cloud plugin for Kestra'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    compileOnly group: "io.kestra", name: "script", version: kestraVersion

    implementation("com.aliyun.odps:odps-sdk-core:0.61.2-public") {
        exclude group: "com.squareup.okhttp3"
        exclude group: "org.codehaus.jackson"
        exclude group: "commons-logging"
        exclude group: "io.netty", module: "netty-all"
        exclude group: "com.aliyun", module: "aliyun-java-auth"
        exclude group: "com.aliyun", module: "credentials-java"
        exclude group: "com.aliyun", module: "tea"
        exclude group: "org.antlr", module: "antlr4"
        exclude group: "org.apache.arrow", module: "arrow-memory-netty"
    }

    implementation "com.aliyun.openservices:aliyun-log:0.6.166"
    implementation "com.aliyun:ecs20140526:8.11.5"
    implementation("com.aliyun.oss:aliyun-sdk-oss:3.18.2") {
        exclude group: "com.aliyun", module: "aliyun-java-sdk-core"
        exclude group: "com.aliyun", module: "aliyun-java-sdk-ram"
        exclude group: "com.aliyun", module: "aliyun-java-sdk-kms"
        exclude group: "com.aliyun", module: "aliyun-java-sdk-ecs"
    }
    constraints {
        implementation("at.yawk.lz4:lz4-java:1.12.0") {
            because "Fixes the compression advisories affecting the SDK's LZ4 default"
        }
    }
}

configurations.configureEach {
    // These patched transports are relocated; the enforced platform otherwise selects vulnerable versions.
    resolutionStrategy.force(
        "org.apache.httpcomponents.client5:httpclient5:5.6.5",
        "org.apache.httpcomponents.core5:httpcore5:5.4.4",
        "org.apache.httpcomponents.core5:httpcore5-h2:5.4.4"
    )
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "script", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"

    testImplementation "org.wiremock:wiremock-jetty12"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
            "X-Kestra-Name": project.name,
            "X-Kestra-Title": "Alibaba Cloud",
            "X-Kestra-Group": project.group + ".alibaba",
            "X-Kestra-Description": project.description,
            "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    dependencies {
        exclude(dependency('com.fasterxml.jackson.*:.*'))
        exclude(dependency('io.opentelemetry:.*'))
        exclude(dependency('org.slf4j:.*'))
    }
    mergeServiceFiles()
    relocate "com.aliyun.odps", "io.kestra.plugin.alibaba.shaded.odps"
    relocate "com.aliyun.openservices", "io.kestra.plugin.alibaba.shaded.openservices"
    relocate "com.aliyun.credentials", "io.kestra.plugin.alibaba.shaded.credentials"
    relocate "org.apache.arrow", "io.kestra.plugin.alibaba.shaded.arrow"
    relocate "com.google.protobuf", "io.kestra.plugin.alibaba.shaded.protobuf"
    relocate "com.alibaba.fastjson", "io.kestra.plugin.alibaba.shaded.fastjson"
    relocate "org.apache.http", "io.kestra.plugin.alibaba.shaded.http"
    relocate "org.apache.hc", "io.kestra.plugin.alibaba.shaded.hc"
    relocate "org.simpleframework", "io.kestra.plugin.alibaba.shaded.simpleframework"
}

tasks.register('verifyPluginJar', Test) {
    description = 'Runs service integration tests against the packaged plugin instead of main class directories.'
    group = 'verification'
    dependsOn testClasses
    def artifact = providers.gradleProperty('pluginJar')
    if (!artifact.isPresent()) {
        dependsOn jar, shadowJar
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(sourceSets.test.output, artifact.isPresent() ? files(artifact.get()) : shadowJar.archiveFile) + configurations.testRuntimeClasspath
    useJUnitPlatform()
    filter {
        excludeTestsMatching '*.cancellationDuringSubmissionStopsReturnedInstanceOnce'
    }
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
